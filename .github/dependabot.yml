version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # A version is proposed only once it is a week old (majors two weeks): a release
    # pulled or found malicious in its first days never reaches a PR. Security updates
    # do not wait. Our own @page2ai/core is exempt.
    cooldown:
      default-days: 7
      semver-major-days: 14
      exclude: ["@page2ai/*"]
    # Every minor and patch update in one PR per run, instead of one PR per package
    # (16 Dependabot PRs piled up across the repos by 2026-11-21). Majors still come
    # one by one, and @page2ai/core keeps its own PR: a core release changes the
    # page2ai arm, so it gets the extract A/B on its own (results-v2/VERSIONS.md).
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        exclude-patterns: ["@page2ai/*"]
    ignore:
      # jsdom 31 replaces @asamuzakjp/dom-selector (patched here for its 2048-character
      # selector cap) with a new selector and computed-style engine that feeds the
      # readability and defuddle arms: a major is a re-run of the scored track, by hand
      # (results-v2/VERSIONS.md, 2026-11-21).
      - dependency-name: jsdom
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
